<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reservation – Chlöpfen Restaurant</title>
  <meta name="description" content="Chlöpfen Restaurant – Book your table">
  <link rel="icon" href="images/logo-small.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Libre+Baskerville&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER / NAVIGATION -->
  <header class="site-header">
    <nav class="nav" aria-label="Main">
      <a class="brand" href="index.html"><img src="images/logo-small.png" alt="Chlöpfen – Home"></a>
      <input type="checkbox" id="menu" class="menu-toggle" aria-label="Open menu">
      <label for="menu" class="menu-btn">Menu</label>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="restaurant.html">Restaurant</a></li>
        <li><a href="events.html">Events</a></li>
        <li><a href="careers.html">Careers</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="reservation.html" class="cta active">Reservation</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="page-title">
      <h1>Reservation</h1>
      <p>Book your table</p>
    </div>
    <section>
      <div class="wrap">
        <form action="mailto:info@chloepfen.ch" method="post" enctype="text/plain">
          <label>Name <input type="text" name="name" required></label>
          <div class="row">
            <label>Email <input type="email" name="email" required></label>
            <label>Phone <input type="tel" name="phone"></label>
          </div>
          <div class="row">
            <label>Date <input type="date" name="date" required></label>
            <label>Time <input type="time" name="time" required></label>
          </div>
          <label>Guests
            <select name="guests"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9+</option></select>
          </label>
          <label>Notes (allergies, occasion) <textarea name="notes" rows="3"></textarea></label>
          <button class="btn" type="submit">Request reservation</button>
        </form>
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <p class="name">Chlöpfen</p>
    <p>Restaurant</p>
    <p>Street 1 · 6000 Luzern · <a href="mailto:info@chloepfen.ch">info@chloepfen.ch</a> · +41 00 000 00 00</p>
    <p>&copy; 2026 Chlöpfen</p>
  </footer>

</body>
</html>
